<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Math Adventure — Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #1a1a2e;
    --paper: #fff6e5;
    --primary: #6c63ff;
    --accent: #ffd23f;
    --danger: #e53935;
    --success: #43a047;
    --sky: #4fc3f7;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: 'Baloo 2', system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(#4fc3f7, var(--paper));
    display: flex; justify-content: center; align-items: flex-start;
  }
  /* Phone frame to sell the "mobile game" feel */
  .phone {
    width: 100%; max-width: 430px; min-height: 100vh;
    background: linear-gradient(var(--sky), var(--paper));
    position: relative; overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,0.25);
  }
  .screen { padding: 20px; min-height: 100vh; display: none; flex-direction: column; }
  .screen.active { display: flex; }

  .panel {
    background: #fff; border: 3.5px solid var(--ink); border-radius: 18px;
    box-shadow: 5px 5px 0 var(--ink); padding: 20px;
  }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; border: 3.5px solid var(--ink); border-radius: 16px;
    box-shadow: 5px 5px 0 var(--ink); background: var(--primary); color: #fff;
    font-family: inherit; font-weight: 800; font-size: 22px; letter-spacing: .5px;
    padding: 14px 24px; cursor: pointer; transition: transform .06s, box-shadow .06s;
    user-select: none;
  }
  .btn:active { transform: translate(4px,4px); box-shadow: 1px 1px 0 var(--ink); }
  .btn.secondary { background:#fff; color: var(--ink); }
  .btn.small { font-size: 18px; }
  .btn:disabled { cursor: default; }

  .title-banner {
    background: var(--primary); border: 3.5px solid var(--ink); border-radius: 18px;
    box-shadow: 5px 5px 0 var(--ink); padding: 18px 26px; transform: rotate(-3deg);
    text-align:center; margin: 10px auto 0;
  }
  .title-banner .l1 { font-size: 52px; line-height:1; font-weight:800; color: var(--accent);
    letter-spacing:2px; text-shadow: 3px 3px 0 var(--ink); }
  .title-banner .l2 { font-size: 38px; line-height:1; font-weight:800; color:#fff;
    letter-spacing:2px; text-shadow: 3px 3px 0 var(--ink); }

  .center { display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; flex:1; text-align:center; }
  .stars-pill { background: var(--accent); border:3.5px solid var(--ink); border-radius:18px;
    box-shadow:5px 5px 0 var(--ink); padding:10px 18px; font-size:20px; font-weight:800; }

  .diff-card { display:flex; align-items:center; gap:14px; color:#fff; margin-bottom:18px; cursor:pointer; }
  .diff-card .emoji { font-size:44px; }
  .diff-card .label { font-size:26px; font-weight:800; text-shadow:2px 2px 0 var(--ink); }
  .diff-card .sub { font-size:13px; font-weight:700; }
  .diff-card .chev { margin-left:auto; font-size:34px; }

  .row { display:flex; align-items:center; }
  .spacer { flex:1; }
  .hdr { font-size:20px; font-weight:800; }

  .progress-track { height:12px; background:#fff; border-radius:10px; overflow:hidden; margin-top:8px;
    border:2px solid var(--ink); }
  .progress-fill { height:100%; width:0; transition: width .3s; }

  .buddy { width:96px; height:96px; border-radius:50%; border:3.5px solid var(--ink);
    box-shadow:4px 4px 0 var(--ink); display:flex; align-items:center; justify-content:center;
    font-size:48px; margin:0 auto; transition: transform .2s, background .2s; background: var(--primary); }
  .buddy.happy { background: var(--success); transform: scale(1.12); }
  .buddy.sad { background: var(--danger); }

  .gain { height:26px; text-align:center; font-size:18px; font-weight:800; color:var(--success);
    opacity:0; transition:opacity .15s; }
  .gain.show { opacity:1; }

  .question { text-align:center; padding:28px 24px; margin-top:10px; }
  .question .op { color: rgba(108,99,255,.7); font-size:16px; font-weight:800; letter-spacing:2px; }
  .question .q { font-size:48px; font-weight:800; text-shadow:2px 2px 0 var(--accent); margin-top:6px; }

  .choices { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:22px; }
  .choice { font-size:28px; }
  .choice.correct { background: var(--success); color:#fff; }
  .choice.wrong { background: var(--danger); color:#fff; }
  .choice.plain { background:#fff; color: var(--ink); }

  .star { font-size:44px; }
  .star.filled { color: var(--accent); text-shadow:2px 2px 0 var(--ink); }
  .star.empty { color:#bbb; }

  .shake { animation: shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-10px)}
    50%{transform:translateX(10px)} 75%{transform:translateX(-6px)} }

  .msg { font-size:18px; font-weight:700; margin-top:12px; }
  .points { font-size:20px; font-weight:800; margin-top:6px; }
  .demo-tag { position:absolute; top:8px; right:8px; background:var(--ink); color:#fff;
    font-size:11px; font-weight:700; padding:3px 8px; border-radius:8px; letter-spacing:1px; z-index:5; }
  /* Note: this is the early lightweight HTML prototype. The full game (worlds,
     boss battles, coins, shop, XP, badges, daily streak) is the Flutter build.
     Build it with `flutter build web` and serve `build/web`. */
</style>
</head>
<body>
<div class="phone">
  <div class="demo-tag">WEB DEMO</div>

  <!-- HOME -->
  <section id="home" class="screen active">
    <div class="center">
      <div class="title-banner"><div class="l1">MATH</div><div class="l2">ADVENTURE</div></div>
      <div style="font-size:18px;font-weight:700;">🦸 Solve puzzles. Beat quests. Become a Math Hero!</div>
      <div class="stars-pill">⭐ Total Stars: <span id="homeStars">0</span> / 9</div>
      <button class="btn" onclick="go('diff')">▶ PLAY</button>
      <button class="btn secondary small" onclick="howTo()">❔ How to Play</button>
      <button class="btn secondary small" onclick="resetProgress()">↺ Reset Progress</button>
    </div>
  </section>

  <!-- DIFFICULTY -->
  <section id="diff" class="screen">
    <div class="row"><button class="btn secondary small" style="width:auto" onclick="go('home')">‹ Back</button>
      <div class="spacer"></div><div class="hdr">Choose Your Quest</div><div class="spacer"></div></div>
    <div style="height:20px"></div>
    <div id="diffList"></div>
  </section>

  <!-- GAME -->
  <section id="game" class="screen">
    <div class="row">
      <div class="hdr" id="gTier">🌱 Easy</div>
      <div class="spacer"></div>
      <div class="hdr">⚡<span id="gScore">0</span></div>
      <div style="width:12px"></div>
      <div class="hdr"><span id="gCount">1</span> / 10</div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="gFill"></div></div>
    <div class="spacer"></div>
    <div class="buddy" id="buddy">🦸</div>
    <div class="gain" id="gain"></div>
    <div class="panel question" id="qCard">
      <div class="op" id="qOp">ADDITION</div>
      <div class="q" id="qText">3 + 4</div>
    </div>
    <div class="choices" id="choices"></div>
    <div class="spacer"></div>
  </section>

  <!-- RESULT -->
  <section id="result" class="screen">
    <div class="center">
      <div class="title-banner" style="transform:rotate(2deg);background:var(--accent)">
        <div style="font-size:28px;font-weight:800;text-shadow:2px 2px 0 var(--ink)" id="rTitle">QUEST COMPLETE!</div>
      </div>
      <div class="panel" style="text-align:center">
        <div id="rStars"></div>
        <div style="font-size:26px;font-weight:800;margin-top:12px" id="rScore">8 / 10 correct</div>
        <div style="font-size:18px;font-weight:700" id="rPct">80%</div>
        <div class="points">⚡ <span id="rPoints">0</span> points</div>
        <div class="msg" id="rMsg"></div>
      </div>
      <button class="btn" onclick="startGame(currentDiff)">↻ Play Again</button>
      <button class="btn secondary small" onclick="go('diff')">🗺 Back to Map</button>
    </div>
  </section>
</div>

<script src="game.js"></script>
</body>
</html>
