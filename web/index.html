<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BrainBuddies">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>BrainBuddies</title>
  <link rel="manifest" href="manifest.json">

  <!-- Synthesized game sound effects (no audio files needed). -->
  <script>
  (function () {
    var ctx = null;
    function ensureCtx() {
      if (ctx === null) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) ctx = new AC();
      }
      if (ctx && ctx.state === 'suspended') ctx.resume();
      return ctx;
    }

    // Play a single tone. type: sine/square/triangle/sawtooth.
    function tone(freq, start, dur, type, gainPeak) {
      var c = ensureCtx();
      if (!c) return;
      var t0 = c.currentTime + start;
      var osc = c.createOscillator();
      var gain = c.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(gainPeak || 0.2, t0 + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain);
      gain.connect(c.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    }

    // A quick upward slide (for a "sparkle").
    function slide(f1, f2, start, dur, type, gainPeak) {
      var c = ensureCtx();
      if (!c) return;
      var t0 = c.currentTime + start;
      var osc = c.createOscillator();
      var gain = c.createGain();
      osc.type = type || 'triangle';
      osc.frequency.setValueAtTime(f1, t0);
      osc.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(gainPeak || 0.2, t0 + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain);
      gain.connect(c.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    }

    window.MAAudio = {
      unlock: function () { ensureCtx(); },
      click: function () { tone(420, 0, 0.06, 'square', 0.12); },
      correct: function () {
        tone(660, 0, 0.10, 'sine', 0.2);
        tone(990, 0.08, 0.14, 'sine', 0.2);
      },
      wrong: function () {
        tone(220, 0, 0.16, 'sawtooth', 0.15);
        tone(160, 0.10, 0.20, 'sawtooth', 0.13);
      },
      coin: function () {
        tone(1180, 0, 0.05, 'square', 0.15);
        tone(1560, 0.05, 0.10, 'square', 0.15);
      },
      levelup: function () {
        var notes = [523, 659, 784, 1047];
        for (var i = 0; i < notes.length; i++) tone(notes[i], i * 0.10, 0.16, 'triangle', 0.2);
      },
      victory: function () {
        var notes = [523, 659, 784, 1047, 1319];
        for (var i = 0; i < notes.length; i++) tone(notes[i], i * 0.12, 0.22, 'sine', 0.22);
        slide(400, 1200, 0.0, 0.5, 'triangle', 0.12);
      }
    };

    // Flat global aliases so Dart can call them without object interop.
    window.maPlaySound = function (name) {
      var fn = window.MAAudio && window.MAAudio[name];
      if (typeof fn === 'function') fn();
    };

    // Browsers block audio until a user gesture; unlock on first tap/key.
    function unlockOnce() {
      ensureCtx();
      window.removeEventListener('pointerdown', unlockOnce);
      window.removeEventListener('keydown', unlockOnce);
    }
    window.addEventListener('pointerdown', unlockOnce);
    window.addEventListener('keydown', unlockOnce);
  })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
